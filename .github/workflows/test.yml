name: Test Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── TypeScript + Unit Tests + Build ────────────────────────
  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Install Rust + wasm-pack (for TS type declarations)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build Wasm types
        run: |
          cargo install wasm-pack --locked || true
          cd mixi-core && wasm-pack build --target web --out-dir pkg

      - name: Build + verify lean DSP wasm (zero imports)
        run: |
          cd mixi-dsp && RUSTFLAGS='-C target-feature=+simd128' cargo build --release --target wasm32-unknown-unknown
          cd ..
          node -e "const fs=require('fs');WebAssembly.compile(fs.readFileSync('mixi-dsp/target/wasm32-unknown-unknown/release/mixi_dsp.wasm')).then(m=>{const n=WebAssembly.Module.imports(m).length;if(n){console.error('FAIL: lean DSP wasm has '+n+' imports');process.exit(1)}console.log('lean DSP wasm OK: 0 imports')})"

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Vite build
        run: npx vite build

  # ── Rust DSP Tests ─────────────────────────────────────────
  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust tests (mixi-core)
        run: cd mixi-core && cargo test

      - name: Rust DSP tests (mixi-dsp lean crate — incl. lean-path parity)
        run: cd mixi-dsp && cargo test

      - name: Rust release build check
        run: cd mixi-core && cargo build --release

      - name: Wasm build check
        run: |
          cargo install wasm-pack --locked || true
          cd mixi-core && wasm-pack build --target web --out-dir pkg

